services:

  app:
    build: .
    container_name: student-task-container

    environment:
      DATABASE_PATH: data/tasks.db

    volumes:
      - task-data:/app/data

  nginx:
    image: nginx:alpine
    container_name: student-task-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: student-task-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: student-task-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  task-data: