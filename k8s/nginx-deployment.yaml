apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-task-nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-task-nginx

  template:
    metadata:
      labels:
        app: student-task-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-config